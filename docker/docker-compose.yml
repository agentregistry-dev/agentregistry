name: agentregistry

services:
  postgres:
    image: postgres:16
    container_name: agent-registry-postgres
    environment:
      POSTGRES_DB: agentregistry
      POSTGRES_USER: agentregistry
      POSTGRES_PASSWORD: agentregistry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentregistry -d agentregistry"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentregistry-network

  agentregistry:
    image: ${DOCKER_REGISTRY:-ghcr.io}/agentregistry-dev/agentregistry/server:${VERSION:?set VERSION to an AgentRegistry release tag}
    container_name: agentregistry-server
    environment:
      AGENT_REGISTRY_DATABASE_URL: "postgres://agentregistry:agentregistry@postgres:5432/agentregistry?sslmode=disable"
      AGENT_REGISTRY_SERVER_ADDRESS: ":8080"
      # Temporarily only for local development.
      AGENT_REGISTRY_ENABLE_REGISTRY_VALIDATION: "false"
      AGENT_REGISTRY_MCP_PORT: "31313"
    ports:
      - "12121:8080"
      - "31313:31313"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/bin/arctl-server", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    networks:
      - agentregistry-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  agentregistry-network:
    driver: bridge

name: agentregistry

services:
  postgres:
    image: postgres:16
    container_name: agent-registry-postgres
    environment:
      POSTGRES_DB: agentregistry
      POSTGRES_USER: agentregistry
      POSTGRES_PASSWORD: agentregistry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentregistry -d agentregistry"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentregistry-network

  # Rewrite the kubeconfig so that 127.0.0.1/localhost server addresses
  # resolve to the Docker host. This supports local Kubernetes clusters
  # whose API server listens on the host machine. The server image has no
  # shell, so this one-shot container does the rewrite. It runs on
  # `docker compose up`, not on a restart, so rerun `up -d` after the host
  # kubeconfig changes.
  kubeconfig:
    image: busybox:1.37
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /kube/config.orig ]; then
          sed -E \
            -e 's|https://127\.0\.0\.1|https://host.docker.internal|g' \
            -e 's|https://localhost|https://host.docker.internal|g' \
            -e 's|certificate-authority-data:.*|insecure-skip-tls-verify: true|g' \
            /kube/config.orig > /kube/out/config
        else
          rm -f /kube/out/config
        fi
    volumes:
      - ~/.kube/config:/kube/config.orig:ro
      - kubeconfig:/kube/out

  agentregistry:
    image: ${DOCKER_REGISTRY:-ghcr.io}/agentregistry-dev/agentregistry/server:${VERSION:?set VERSION to an AgentRegistry release tag}
    container_name: agentregistry-server
    environment:
      AGENT_REGISTRY_DATABASE_URL: "postgres://agentregistry:agentregistry@postgres:5432/agentregistry?sslmode=disable"
      AGENT_REGISTRY_SERVER_ADDRESS: ":8080"
      # Temporarily only for local development.
      AGENT_REGISTRY_ENABLE_REGISTRY_VALIDATION: "false"
      AGENT_REGISTRY_MCP_PORT: "31313"
      KUBECONFIG: "/root/.kube/config"
    ports:
      - "12121:8080"
      - "31313:31313"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kubeconfig:/root/.kube:ro
    depends_on:
      postgres:
        condition: service_healthy
      kubeconfig:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/bin/arctl-server", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    networks:
      - agentregistry-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  kubeconfig:
    driver: local

networks:
  agentregistry-network:
    driver: bridge

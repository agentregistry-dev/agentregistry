description: |-
  AgentSpec is the agent resource's declarative body.

  References to other resources (MCP servers) are pure ResourceRefs — no
  inline runtime configuration. To deploy an agent with a specific MCP server
  wired in, define a top-level MCPServer resource and reference it here.
properties:
  compatibleHarnesses:
    description: |-
      compatibleHarnesses declares which coding harnesses this Agent can run
      under. The Deployment selects the concrete harness type for a
      rollout; Agent remains the portable compatibility contract.
    items:
      description: |-
        HarnessCompatibility declares one harness family this Agent can run under.
        Rollout policy selection lives on Deployment so the same Agent can be rolled
        out with different compatible harnesses.
      properties:
        type:
          description: type is the harness family, e.g. "claude-code", "codex", "opencode".
          minLength: 1
          type: string
      required:
      - type
      type: object
    type: array
  description:
    description: description is part of AgentSpec.
    type: string
  iconUrl:
    description: |-
      iconUrl is the image a catalog UI shows for this agent. Either an
      absolute https:// URL or a root-relative path served by the UI.
    type: string
  instructions:
    description: instructions is part of AgentSpec.
    properties:
      kind:
        description: kind is part of ResourceRef.
        minLength: 1
        type: string
      name:
        description: name is part of ResourceRef.
        minLength: 1
        type: string
      namespace:
        description: namespace is part of ResourceRef.
        type: string
      tag:
        description: tag is part of ResourceRef.
        type: string
    required:
    - kind
    - name
    type: object
  mcpServers:
    description: mcpServers is part of AgentSpec.
    items:
      description: |-
        ResourceRef is a typed reference to another resource in the registry.
        Public references use one shape across v1alpha1: {Kind, Namespace, Name,
        Tag}. Tag is meaningful only for taggable registry artifacts.

        Namespace is optional: blank means "same namespace as the referencing
        object" (the common case). Tag is optional: blank means "resolve to the
        literal latest tag" for taggable artifacts or "resolve by namespace/name"
        for mutable object kinds.
      properties:
        kind:
          description: kind is part of ResourceRef.
          minLength: 1
          type: string
        name:
          description: name is part of ResourceRef.
          minLength: 1
          type: string
        namespace:
          description: namespace is part of ResourceRef.
          type: string
        tag:
          description: tag is part of ResourceRef.
          type: string
      required:
      - kind
      - name
      type: object
    type: array
  modelName:
    description: modelName is part of AgentSpec.
    type: string
  modelProvider:
    description: |-
      modelProvider and ModelName are retained for one release so existing
      Agent resources continue to decode and round-trip without data loss.

      Deprecated: these fields do not select or configure a runtime model.
      New and migrated Deployments must use spec.modelRef; distributions may
      temporarily preserve Deployment MODEL_PROVIDER / MODEL_NAME environment
      values when modelRef is omitted.
    type: string
  plugins:
    description: |-
      plugins are top-level, harness-agnostic references to what the agent
      is assembled from. The selected Deployment harness materializes what it
      supports and drops-with-warning the rest (capability matrix). Plugins,
      Skills, and Instructions require compatibleHarnesses because a prebuilt
      Image cannot consume them by itself. MCPServers flow to harness runtimes
      and remain available to any other runtime that supports MCP. Each ref's
      Kind defaults to the field's resource kind; empty Tag means "resolve
      latest at reference time".
    items:
      description: |-
        ResourceRef is a typed reference to another resource in the registry.
        Public references use one shape across v1alpha1: {Kind, Namespace, Name,
        Tag}. Tag is meaningful only for taggable registry artifacts.

        Namespace is optional: blank means "same namespace as the referencing
        object" (the common case). Tag is optional: blank means "resolve to the
        literal latest tag" for taggable artifacts or "resolve by namespace/name"
        for mutable object kinds.
      properties:
        kind:
          description: kind is part of ResourceRef.
          minLength: 1
          type: string
        name:
          description: name is part of ResourceRef.
          minLength: 1
          type: string
        namespace:
          description: namespace is part of ResourceRef.
          type: string
        tag:
          description: tag is part of ResourceRef.
          type: string
      required:
      - kind
      - name
      type: object
    type: array
  skills:
    description: skills is part of AgentSpec.
    items:
      description: |-
        ResourceRef is a typed reference to another resource in the registry.
        Public references use one shape across v1alpha1: {Kind, Namespace, Name,
        Tag}. Tag is meaningful only for taggable registry artifacts.

        Namespace is optional: blank means "same namespace as the referencing
        object" (the common case). Tag is optional: blank means "resolve to the
        literal latest tag" for taggable artifacts or "resolve by namespace/name"
        for mutable object kinds.
      properties:
        kind:
          description: kind is part of ResourceRef.
          minLength: 1
          type: string
        name:
          description: name is part of ResourceRef.
          minLength: 1
          type: string
        namespace:
          description: namespace is part of ResourceRef.
          type: string
        tag:
          description: tag is part of ResourceRef.
          type: string
      required:
      - kind
      - name
      type: object
    type: array
  source:
    description: |-
      source declares where the agent comes from — Image (the runtime
      container) and/or Repository (the source code).
    properties:
      image:
        description: |-
          image is the OCI container image reference that runs the agent.
          Format: <registry>/<name>:<tag> (e.g. ghcr.io/owner/agent:1.0.0).
        type: string
      protocol:
        description: |-
          protocol is the application protocol spoken by every runnable form of the
          agent, whether built from Repository or supplied as Image. When omitted,
          A2A is inferred as the default.
        type: string
      repository:
        description: repository links to the source code the image was built from.
        properties:
          branch:
            description: branch is part of Repository.
            type: string
          commit:
            description: commit is part of Repository.
            type: string
          credentialsRef:
            description: |-
              credentialsRef names a Secret holding credentials for a private
              repository. Git needs a pair, so resolvers read username/password.
            properties:
              name:
                description: name is part of LocalSecretReference.
                minLength: 1
                type: string
            required:
            - name
            type: object
          subfolder:
            description: subfolder is part of Repository.
            type: string
          url:
            description: url is part of Repository.
            type: string
        type: object
    type: object
  title:
    description: title is the agent's catalog display name.
    type: string
type: object

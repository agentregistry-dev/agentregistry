# Admin-owned: a deployable model — identity plus how the platform reaches
# and authenticates to it. Deployments select one via spec.modelRef; auth and
# endpoint are not overridable at deployment time.
apiVersion: ar.dev/v1alpha1
kind: Model
metadata:
  name: claude-opus-4-8
spec:
  title: Claude Opus 4.8 (Bedrock)
  provider: bedrock
  model: us.anthropic.claude-opus-4-8
  auth:
    strategy: runtime # ambient AWS/IAM identity
---
# A dev-environment entry for the same underlying model, key-based through a
# gateway. OSS stores the secretRef opaquely; distributions with a secret
# store resolve it at deploy time.
apiVersion: ar.dev/v1alpha1
kind: Model
metadata:
  name: claude-opus-4-8-dev
spec:
  provider: anthropic
  model: claude-opus-4-8
  auth:
    strategy: secretRef
    secretRef:
      name: anthropic-dev-key
      key: api-key
  endpoint:
    baseUrl: https://litellm.dev.internal

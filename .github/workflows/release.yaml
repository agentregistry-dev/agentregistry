name: Release

on:
  push:
    tags:
    - "v*.*.*"
  workflow_call:
    inputs:
      version:
        description: Nightly version, including the leading v
        required: true
        type: string
      image_alias:
        description: Optional moving container image tag
        required: false
        default: ""
        type: string

env:
  # Include the caller's owner so reusable releases from forks publish to the
  # fork owner's GHCR namespace.
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REPO: agentregistry

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Validate version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        REF_VERSION: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        if [[ -n "${INPUT_VERSION}" ]]; then
          VERSION="${INPUT_VERSION}"
          if [[ ! "${VERSION}" =~ ^v0\.0\.0-alpha\.[0-9a-f]{12}$ ]]; then
            echo "::error::nightly version must match v0.0.0-alpha.<12-character-sha>; got ${VERSION}"
            exit 1
          fi
        else
          VERSION="${REF_VERSION}"
          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release version must match vX.Y.Z; got ${VERSION}"
            exit 1
          fi
        fi

        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  docker:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: ${{ needs.validate.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v6
      with:
        go-version-file: "go.mod"
        cache-dependency-path: |
          go.sum
          tools/go.sum

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.9.x

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64,linux/arm64
        version: v0.23.0
        use: 'true'
    - name: Build server image
      env:
        DOCKER_BUILD_ARGS: "--push --platform linux/amd64,linux/arm64"
        DOCKER_BUILDER: "docker buildx"
      run: make docker-server

    - name: Promote image alias
      if: ${{ inputs.image_alias != '' }}
      env:
        IMAGE_ALIAS: ${{ inputs.image_alias }}
      run: |
        docker buildx imagetools create \
          --tag "${IMAGE_REGISTRY}/${DOCKER_REPO}/server:${IMAGE_ALIAS}" \
          "${IMAGE_REGISTRY}/${DOCKER_REPO}/server:${VERSION}"

  release:
    needs:
    - docker
    - validate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      HELM_PLUGIN_UNITTEST_VERSION: v1.0.3
      HELM_REGISTRY: ${{ secrets.HELM_REGISTRY || 'ghcr.io' }}
      HELM_REPO: ${{ secrets.HELM_REPO || 'agentregistry-dev/agentregistry' }}
      HELM: go tool -modfile=tools/go.mod helm
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: "go.mod"
        cache-dependency-path: |
          go.sum
          tools/go.sum

    - name: Cache Helm plugins
      uses: actions/cache@v4
      with:
        path: ~/.local/share/helm/plugins
        key: ${{ runner.os }}-helm-plugins-unittest-${{ env.HELM_PLUGIN_UNITTEST_VERSION }}
        restore-keys: |
          ${{ runner.os }}-helm-plugins-unittest-


    - name: Log in to Helm registry
      env:
        HELM_REGISTRY_USERNAME: ${{ secrets.HELM_REGISTRY_USERNAME || github.actor }}
        HELM_REGISTRY_PASSWORD: ${{ secrets.HELM_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        printf "%s" "${HELM_REGISTRY_PASSWORD}" | $HELM registry login "${HELM_REGISTRY}" \
          --username "${HELM_REGISTRY_USERNAME}" \
          --password-stdin

    - name: Build Release Artifacts
      run: make release-cli

    - name: Release Helm chart
      run: make charts-release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        generate_release_notes: true
        files: |
          bin/arctl-*
          build/charts/*.tgz
          build/charts/checksums.txt

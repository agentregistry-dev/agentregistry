          items:
            $ref: '#/components/schemas/ServerInput'
          type:
          - array
          - "null"
        fileSha256:
          type: string
        identifier:
          type: string
        packageArguments:
          items:
            $ref: '#/components/schemas/ServerArgument'
          type:
          - array
          - "null"
        registryBaseUrl:
          type: string
        registryType:
          type: string
        runtimeArguments:
          items:
            $ref: '#/components/schemas/ServerArgument'
          type:
          - array
          - "null"
        runtimeHint:
          type: string
        transport:
          $ref: '#/components/schemas/ServerTransport'
        version:
          type: string
      required:
      - registryType
      - identifier
      - version
      - transport
      type: object
    ServerRepository:
      additionalProperties: false
      properties:
        id:
          type: string
        source:
          type: string
        subfolder:
          type: string
        url:
          type: string
      required:
      - url
      type: object
    ServerResponse:
      additionalProperties: false
      properties:
        _meta:
          $ref: '#/components/schemas/ResponseMeta'
        server:
          $ref: '#/components/schemas/ServerDetail'
      required:
      - server
      type: object
    ServerTransport:
      additionalProperties: false
      properties:
        headers:
          items:
            $ref: '#/components/schemas/ServerInput'
          type:
          - array
          - "null"
        type:
          type: string
        url:
          type: string
      required:
      - type
      type: object
    Skill:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          $ref: '#/components/schemas/SkillSpec'
        status:
          $ref: '#/components/schemas/SkillStatus'
      required:
      - metadata
      - spec
      - apiVersion
      - kind
      type: object
    SkillResolvedSource:
      additionalProperties: false
      properties:
        commit:
          type: string
      type: object
    SkillSource:
      additionalProperties: false
      properties:
        repository:
          $ref: '#/components/schemas/Repository'
      type: object
    SkillSpec:
      description: SkillSpec is the skill resource's declarative body.
      properties:
        description:
          description: description is part of SkillSpec.
          type: string
        iconUrl:
          description: |-
            iconUrl is the image a catalog UI shows for this skill. Either an
            absolute https:// URL or a root-relative path served by the UI.
          type: string
        source:
          description: source is part of SkillSpec.
          properties:
            repository:
              description: repository is part of SkillSource.
              properties:
                branch:
                  description: branch is part of Repository.
                  type: string
                commit:
                  description: commit is part of Repository.
                  type: string
                credentialsRef:
                  description: |-
                    credentialsRef names a Secret holding credentials for a private
                    repository. Git needs a pair, so resolvers read username/password.
                  properties:
                    name:
                      description: name is part of LocalSecretReference.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                subfolder:
                  description: subfolder is part of Repository.
                  type: string
                url:
                  description: url is part of Repository.
                  type: string
              type: object
          type: object
        title:
          description: title is part of SkillSpec.
          type: string
      type: object
    SkillStatus:
      additionalProperties: false
      properties:
        conditions:
          items:
            $ref: '#/components/schemas/Condition'
          type:
          - array
          - "null"
        details: {}
        resolvedSource:
          $ref: '#/components/schemas/SkillResolvedSource'
      type: object
    Status:
      additionalProperties: false
      properties:
        conditions:
          items:
            $ref: '#/components/schemas/Condition'
          type:
          - array
          - "null"
        details: {}
      type: object
    VersionBody:
      additionalProperties: false
      properties:
        build_time:
          description: Build timestamp
          examples:
          - "2025-10-14T12:00:00Z"
          type: string
        git_commit:
          description: Git commit SHA
          examples:
          - abc123d
          type: string
        version:
          description: Application version
          examples:
          - v1.0.0
          type: string
      required:
      - version
      - git_commit
      - build_time
      type: object
info:
  description: AgentRegistry API for managing MCP servers, agents, skills, and deployments.

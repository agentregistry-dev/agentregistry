components:
  schemas:
    Agent:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          $ref: '#/components/schemas/AgentSpec'
        status:
          $ref: '#/components/schemas/Status'
      required:
      - metadata
      - spec
      - apiVersion
      - kind
      type: object
    AgentSource:
      additionalProperties: false
      properties:
        image:
          type: string
        protocol:
          enum:
          - A2A
          - HTTP
          type: string
        repository:
          $ref: '#/components/schemas/Repository'
      type: object
    AgentSpec:
      description: |-
        AgentSpec is the agent resource's declarative body.

        References to other resources (MCP servers) are pure ResourceRefs — no
        inline runtime configuration. To deploy an agent with a specific MCP server
        wired in, define a top-level MCPServer resource and reference it here.
      properties:
        compatibleHarnesses:
          description: |-
            compatibleHarnesses declares which coding harnesses this Agent can run
            under. The Deployment selects the concrete harness type for a
            rollout; Agent remains the portable compatibility contract.
          items:
            description: |-
              HarnessCompatibility declares one harness family this Agent can run under.
              Rollout policy selection lives on Deployment so the same Agent can be rolled
              out with different compatible harnesses.
            properties:
              type:
                description: type is the harness family, e.g. "claude-code", "codex",
                  "opencode".
                minLength: 1
                type: string
            required:
            - type
            type: object
          type: array
        description:
          description: description is part of AgentSpec.
          type: string
        iconUrl:
          description: |-
            iconUrl is the image a catalog UI shows for this agent. Either an
            absolute https:// URL or a root-relative path served by the UI.
          type: string
        instructions:
          description: instructions is part of AgentSpec.
          properties:
            kind:
              description: kind is part of ResourceRef.
              minLength: 1
              type: string
            name:
              description: name is part of ResourceRef.
              minLength: 1
              type: string
            namespace:
              description: namespace is part of ResourceRef.
              type: string
            tag:
              description: tag is part of ResourceRef.
              type: string
          required:
          - kind
          - name
          type: object
        mcpServers:
          description: mcpServers is part of AgentSpec.
          items:
            description: |-
              ResourceRef is a typed reference to another resource in the registry.
              Public references use one shape across v1alpha1: {Kind, Namespace, Name,
              Tag}. Tag is meaningful only for taggable registry artifacts.

              Namespace is optional: blank means "same namespace as the referencing
              object" (the common case). Tag is optional: blank means "resolve to the
              literal latest tag" for taggable artifacts or "resolve by namespace/name"
              for mutable object kinds.
            properties:
              kind:
                description: kind is part of ResourceRef.
                minLength: 1
                type: string
              name:
                description: name is part of ResourceRef.
                minLength: 1
                type: string
              namespace:
                description: namespace is part of ResourceRef.
                type: string
              tag:
                description: tag is part of ResourceRef.
                type: string
            required:
            - kind
            - name
            type: object
          type: array
        modelName:
          description: modelName is part of AgentSpec.
          type: string
        modelProvider:
          description: |-
            modelProvider and ModelName are retained for one release so existing
            Agent resources continue to decode and round-trip without data loss.

            Deprecated: these fields do not select or configure a runtime model.
            New and migrated Deployments must use spec.modelRef; distributions may
            temporarily preserve Deployment MODEL_PROVIDER / MODEL_NAME environment
            values when modelRef is omitted.
          type: string
        plugins:
          description: |-
            plugins are top-level, harness-agnostic references to what the agent
            is assembled from. The selected Deployment harness materializes what it
            supports and drops-with-warning the rest (capability matrix). Plugins,
            Skills, and Instructions require compatibleHarnesses because a prebuilt
            Image cannot consume them by itself. MCPServers flow to harness runtimes
            and remain available to any other runtime that supports MCP. Each ref's
            Kind defaults to the field's resource kind; empty Tag means "resolve
            latest at reference time".
          items:
            description: |-
              ResourceRef is a typed reference to another resource in the registry.
              Public references use one shape across v1alpha1: {Kind, Namespace, Name,
              Tag}. Tag is meaningful only for taggable registry artifacts.

              Namespace is optional: blank means "same namespace as the referencing
              object" (the common case). Tag is optional: blank means "resolve to the
              literal latest tag" for taggable artifacts or "resolve by namespace/name"
              for mutable object kinds.
            properties:
              kind:
                description: kind is part of ResourceRef.
                minLength: 1
                type: string
              name:
                description: name is part of ResourceRef.
                minLength: 1
                type: string
              namespace:
                description: namespace is part of ResourceRef.
                type: string
              tag:
                description: tag is part of ResourceRef.
                type: string
            required:
            - kind
            - name
            type: object
          type: array
        skills:
          description: skills is part of AgentSpec.
          items:
            description: |-
              ResourceRef is a typed reference to another resource in the registry.
              Public references use one shape across v1alpha1: {Kind, Namespace, Name,
              Tag}. Tag is meaningful only for taggable registry artifacts.

              Namespace is optional: blank means "same namespace as the referencing
              object" (the common case). Tag is optional: blank means "resolve to the
              literal latest tag" for taggable artifacts or "resolve by namespace/name"
              for mutable object kinds.
            properties:
              kind:
                description: kind is part of ResourceRef.
                minLength: 1
                type: string
              name:
                description: name is part of ResourceRef.
                minLength: 1
                type: string
              namespace:
                description: namespace is part of ResourceRef.
                type: string
              tag:
                description: tag is part of ResourceRef.
                type: string
            required:
            - kind
            - name
            type: object
          type: array
        source:
          description: |-
            source declares where the agent comes from — Image (the runtime
            container) and/or Repository (the source code).
          properties:
            image:
              description: |-
                image is the OCI container image reference that runs the agent.
                Format: <registry>/<name>:<tag> (e.g. ghcr.io/owner/agent:1.0.0).
              type: string
            protocol:
              description: |-
                protocol is the application protocol spoken by every runnable form of the
                agent, whether built from Repository or supplied as Image. When omitted,
                A2A is inferred as the default.
              type: string
            repository:
              description: repository links to the source code the image was built
                from.
              properties:
                branch:
                  description: branch is part of Repository.
                  type: string
                commit:
                  description: commit is part of Repository.
                  type: string
                credentialsRef:
                  description: |-
                    credentialsRef names a Secret holding credentials for a private
                    repository. Git needs a pair, so resolvers read username/password.
                  properties:
                    name:
                      description: name is part of LocalSecretReference.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                subfolder:
                  description: subfolder is part of Repository.
                  type: string
                url:
                  description: url is part of Repository.
                  type: string
              type: object
          type: object
        title:
          description: title is the agent's catalog display name.
          type: string
      type: object
    ApplyResult:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        error:
          type: string
        kind:
          type: string
        name:
          type: string
        namespace:
          type: string
        status:
          type: string
        tag:
          type: string
      required:
      - name
      - status
      type: object
    ApplyResultsResponse:
      additionalProperties: false
      properties:
        results:
          items:
            $ref: '#/components/schemas/ApplyResult'
          type:
          - array
          - "null"
      required:
      - results
      type: object
    CommandEntry:
      additionalProperties: false
      properties:
        allowedTools:
          items:
            type: string
          type:
          - array
          - "null"
        argumentHint:
          type: string
        content:
          type: string
        description:
          type: string
        model:
          type: string
        source:
          type: string
      type: object
    CommandsField:
      additionalProperties: false
      properties:
        Map:
          additionalProperties:
            $ref: '#/components/schemas/CommandEntry'
          type: object
        Paths:
          $ref: '#/components/schemas/PathOrPaths'
      required:
      - Paths
      - Map
      type: object
    Condition:
      additionalProperties: false
      properties:
        lastTransitionTime:
          format: date-time
          type: string
        message:
          type: string
        reason:
          type: string
        status:
          type: string
        type:
          type: string
      required:
      - type
      - status
      type: object
    Deployment:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          $ref: '#/components/schemas/DeploymentSpec'
        status:
          $ref: '#/components/schemas/Status'
      required:
      - metadata
      - spec
      - apiVersion
      - kind
      type: object
    DeploymentHarness:
      additionalProperties: false
      properties:
        permissionMode:
          type: string
        type:
          type: string
      required:
      - type
      type: object
    DeploymentRef:
      additionalProperties: false
      properties:
        name:
          type: string
        namespace:
          type: string
      required:
      - name
      type: object
    DeploymentSpec:
      description: |-
        DeploymentSpec is the deployment resource's declarative body.

        TargetRef is required and must name a top-level Agent or MCPServer. The
        referenced resource's spec is the source of truth for what to run; this
        Deployment contributes only runtime overrides (env, runtimeConfig) and
        lifecycle intent (desiredState).

        RuntimeRef is required and must name a top-level Runtime. The embedding
        application registers the adapters that resolve how and where the target is
        executed.
      properties:
        deploymentRefs:
          description: |-
            deploymentRefs declaratively binds this Deployment to other
            Deployments — e.g. an Agent Deployment binding to the MCPServer
            Deployments whose status should feed its runtime config. Stored
            and structurally validated; binding semantics are owned by the
            kind's reconciler.
          items:
            description: |-
              DeploymentRef is a typed reference to another Deployment resource. Kind
              is implicit (always Deployment) and Tag is omitted because Deployment is
              a mutable-object kind keyed by namespace/name.

              Namespace is optional: blank means "same namespace as the referencing
              Deployment".
            properties:
              name:
                description: name is part of DeploymentRef.
                minLength: 1
                type: string
              namespace:
                description: namespace is part of DeploymentRef.
                type: string
            required:
            - name
            type: object
          type: array
        desiredState:
          description: desiredState is part of DeploymentSpec.
          type: string
        env:
          additionalProperties:
            type: string
          description: env is part of DeploymentSpec.
          type: object
        harness:
          description: |-
            harness selects a compatible harness for Agent deployments and configures
            rollout-specific harness policy. Omitted for BYO image/source Agent
            deployments and MCPServer deployments.
          properties:
            permissionMode:
              description: |-
                permissionMode controls the harness tool-permission posture, e.g.
                "default", "acceptEdits", "bypassPermissions". Empty defaults to
                "bypassPermissions" for headless harness runtimes (no interactive
                approval is possible); subject to security review.
              type: string
            type:
              description: type is the selected harness family, e.g. "claude-code",
                "codex".
              minLength: 1
              type: string
          required:
          - type
          type: object
        modelRef:
          description: |-
            modelRef selects the tagged Model for this Deployment. When omitted from
            a harness Agent Deployment, it defaults to Model/default@latest in the
            Deployment namespace. It remains optional with no implicit selection for
            non-harness Agent and MCPServer Deployments. Provider, endpoint, and auth
            configuration remain on the referenced Model.
          properties:
            name:
              description: name is part of ModelRef.
              minLength: 1
              type: string
            namespace:
              description: namespace is part of ModelRef.
              type: string
            tag:
              description: tag is part of ModelRef.
              type: string
          required:
          - name
          type: object
        runtimeConfig:
          description: |-
            runtimeConfig carries adapter-specific per-Deployment configuration.
            Its schema is selected by the resolved Runtime type and validated by that
            runtime's DeploymentAdapter.
          x-kubernetes-preserve-unknown-fields: true
        runtimeRef:
          description: runtimeRef is part of DeploymentSpec.
          properties:
            kind:
              description: kind is part of ResourceRef.
              minLength: 1
              type: string
            name:
              description: name is part of ResourceRef.
              minLength: 1
              type: string
            namespace:
              description: namespace is part of ResourceRef.
              type: string
            tag:
              description: tag is part of ResourceRef.
              type: string
          required:
          - kind
          - name
          type: object
        targetRef:
          description: targetRef is part of DeploymentSpec.
          properties:
            kind:
              description: kind is part of ResourceRef.
              minLength: 1
              type: string
            name:
              description: name is part of ResourceRef.
              minLength: 1
              type: string
            namespace:
              description: namespace is part of ResourceRef.
              type: string
            tag:
              description: tag is part of ResourceRef.
              type: string
          required:
          - kind
          - name
          type: object
      required:
      - runtimeRef
      - targetRef
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of
            the problem.
          examples:
          - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
          - array
          - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of
            the problem.
          examples:
          - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
          - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value
            should not change between occurrences of the error.
          examples:
          - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
          - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HTTPHeader:
      additionalProperties: false
      properties:
        name:
          type: string
        value:
          type: string
      required:
      - name
      type: object
    HarnessCompatibility:
      additionalProperties: false
      properties:
        type:
          type: string
      required:
      - type
      type: object
    HealthBody:
      additionalProperties: false
      properties:
        status:
          description: Health status
          examples:
          - ok
          type: string
      required:
      - status
      type: object
    HookEntry:
      additionalProperties: false
      properties:
        allowedEnvVars:
          items:
            type: string
          type:
          - array
          - "null"
        async:
          type: boolean
        asyncRewake:
          type: boolean
        command:
          type: string
        headers:
          additionalProperties:
            type: string
          type: object
        if:
          type: string
        input: {}
        model:
          type: string
        once:
          type: boolean
        prompt:
          type: string
        server:
          type: string
        shell:
          type: string
        statusMessage:
          type: string
        timeout:
          format: double
          type: number
        tool:
          type: string
        type:
          type: string
        url:
          type: string
      required:
      - type
      type: object
    HookMatcherGroup:
      additionalProperties: false
      properties:
        hooks:
          items:
            $ref: '#/components/schemas/HookEntry'
          type:
          - array
          - "null"
        matcher:
          type: string
      required:
      - hooks
      type: object
    HooksField:
      additionalProperties: false
      properties:
        Events:
          additionalProperties:
            items:
              $ref: '#/components/schemas/HookMatcherGroup'
            type:
            - array
            - "null"
          type: object
        Path:
          type: string
        Raw: {}
      required:
      - Path
      - Events
      - Raw
      type: object
    LSPServerEntry:
      additionalProperties: false
      properties:
        args:
          items:
            type: string
          type:
          - array
          - "null"
        command:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        extensionToLanguage:
          additionalProperties:
            type: string
          type: object
        initializationOptions: {}
        maxRestarts:
          format: int64
          type: integer
        settings: {}
        startupTimeout:
          format: int64
          type: integer
        transport:
          type: string
        workspaceFolder:
          type: string
      required:
      - command
      - extensionToLanguage
      type: object
    LSPServersField:
      additionalProperties: false
      properties:
        Path:
          type: string
        Raw: {}
        Servers:
          additionalProperties:
            $ref: '#/components/schemas/LSPServerEntry'
          type: object
      required:
      - Path
      - Servers
      - Raw
      type: object
    ListMetadata:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        nextCursor:
          type: string
      required:
      - count
      type: object
    ListOutputAgentBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Agent'
          type:
          - array
          - "null"
        nextCursor:
          type: string
      required:
      - items
      type: object
    ListOutputDeploymentBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Deployment'
          type:
          - array
          - "null"
        nextCursor:
          type: string
      required:
      - items
      type: object
    ListOutputMCPServerBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/MCPServer'
          type:
          - array
          - "null"
        nextCursor:
          type: string
      required:
      - items
      type: object
    ListOutputModelBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Model'
          type:
          - array
          - "null"
        nextCursor:
          type: string
      required:
      - items
      type: object
    ListOutputPluginBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Plugin'
          type:
          - array
          - "null"
        nextCursor:
          type: string
      required:
      - items
      type: object
    ListOutputPromptBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Prompt'
          type:
          - array
          - "null"
        nextCursor:
          type: string
      required:
      - items
      type: object
    ListOutputRuntimeBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Runtime'
          type:
          - array
          - "null"
        nextCursor:
          type: string
      required:
      - items
      type: object
    ListOutputSecretBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Secret'
          type:
          - array
          - "null"
        nextCursor:
          type: string
      required:
      - items
      type: object
    ListOutputSkillBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Skill'
          type:
          - array
          - "null"
        nextCursor:
          type: string
      required:
      - items
      type: object
    LocalSecretReference:
      additionalProperties: false
      properties:
        name:
          type: string
      required:
      - name
      type: object
    MCPArgument:
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          type: string
        value:
          type: string
      required:
      - type
      type: object
    MCPKeyValueInput:
      additionalProperties: false
      properties:
        isRequired:
          type: boolean
        name:
          type: string
        value:
          type: string
      required:
      - name
      type: object
    MCPPackage:
      additionalProperties: false
      properties:
        launch:
          $ref: '#/components/schemas/MCPPackageLaunch'
        origin:
          $ref: '#/components/schemas/MCPPackageOrigin'
        transport:
          $ref: '#/components/schemas/MCPTransport'
      required:
      - origin
      - transport
      type: object
    MCPPackageLaunch:
      additionalProperties: false
      properties:
        args:
          items:
            $ref: '#/components/schemas/MCPArgument'
          type:
          - array
          - "null"
        command:
          type: string
        env:
          items:
            $ref: '#/components/schemas/MCPKeyValueInput'
          type:
          - array
          - "null"
      type: object
    MCPPackageOrigin:
      additionalProperties: false
      properties:
        identifier:
          type: string
        npm:
          $ref: '#/components/schemas/MCPPackageOriginNPM'
        oci:
          $ref: '#/components/schemas/MCPPackageOriginOCI'
        pypi:
          $ref: '#/components/schemas/MCPPackageOriginPyPI'
        type:
          type: string
      required:
      - type
      - identifier
      type: object
    MCPPackageOriginNPM:
      additionalProperties: false
      properties:
        mirror:
          type: string
        serverName:
          type: string
        version:
          type: string
      required:
      - version
      - serverName
      type: object
    MCPPackageOriginOCI:
      additionalProperties: false
      properties:
        serverName:
          type: string
      required:
      - serverName
      type: object
    MCPPackageOriginPyPI:
      additionalProperties: false
      properties:
        mirror:
          type: string
        serverName:
          type: string
        version:
          type: string
      required:
      - version
      - serverName
      type: object
    MCPRemote:
      additionalProperties: false
      properties:
        headers:
          items:
            $ref: '#/components/schemas/HTTPHeader'
          type:
          - array
          - "null"
        type:
          type: string
        url:
          type: string
      required:
      - type
      - url
      type: object
    MCPServer:
      additionalProperties: false
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          $ref: '#/components/schemas/MCPServerSpec'
        status:
          $ref: '#/components/schemas/Status'
      required:
      - metadata
      - spec
      - apiVersion
      - kind
      type: object
    MCPServerEntry:
      additionalProperties: false
      properties:
        args:
          items:
            type: string
          type:
          - array
          - "null"
        command:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        headers:
          additionalProperties:
            type: string
          type: object
        headersHelper:
          type: string
        oauth:
          $ref: '#/components/schemas/MCPServerOAuth'
        type:
          type: string
        url:
          type: string
      type: object
    MCPServerOAuth:
      additionalProperties: false
      properties:
        authServerMetadataUrl:
          type: string
        callbackPort:
          format: int64
          type: integer
        clientId:
          type: string
        scopes:
          items:
            type: string
          type:
          - array
          - "null"
      type: object
    MCPServerSource:
      additionalProperties: false
      properties:
        package:
          $ref: '#/components/schemas/MCPPackage'
        repository:
          $ref: '#/components/schemas/Repository'
      type: object
    MCPServerSpec:
      description: MCPServerSpec is the MCP server's declarative body.
      properties:
        description:
          description: description is part of MCPServerSpec.
          type: string
        iconUrl:
          description: |-
            iconUrl is the image a catalog UI shows for this MCP server. Either an
            absolute https:// URL or a root-relative path served by the UI.
          type: string
        remote:
          description: |-
            remote declares a remote MCP server instead of a bundled one. These are pre-existing
            MCP servers that the registry does not deploy but can be referenced by Agents.
          properties:
            headers:
              description: headers is part of MCPRemote.
              items:
                description: HTTPHeader is an HTTP header sent on requests to a remote
                  MCP server.
                properties:
                  name:
                    description: name is part of HTTPHeader.
                    minLength: 1
                    type: string
                  value:

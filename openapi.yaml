          description: URL-encoded '<namespace>/<name>' server name.
          type: string
      - explode: false
        in: query
        name: cursor
        schema:
          type: string
      - explode: false
        in: query
        name: limit
        schema:
          format: int64
          type: integer
      - explode: false
        in: query
        name: include_deleted
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerListResponse'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List versions of an MCP server (MCP Registry v0.1 compatibility)
      tags:
      - servers

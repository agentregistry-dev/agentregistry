      - description: Opaque pagination cursor from a prior response.
        explode: false
        in: query
        name: cursor
        schema:
          description: Opaque pagination cursor from a prior response.
          type: string
      - description: Max servers to return (capped at 100).
        explode: false
        in: query
        name: limit
        schema:
          description: Max servers to return (capped at 100).
          format: int64
          type: integer
      - description: Substring match on the server name.
        explode: false
        in: query
        name: search
        schema:
          description: Substring match on the server name.
          type: string
      - description: RFC3339 timestamp; only servers updated at or after this time.
        explode: false
        in: query
        name: updated_since
        schema:
          description: RFC3339 timestamp; only servers updated at or after this time.
          type: string
      - description: '''latest'' (default) or a specific version tag.'
        explode: false
        in: query
        name: version
        schema:
          description: '''latest'' (default) or a specific version tag.'
          type: string
      - description: Include servers pending deletion.
        explode: false
        in: query
        name: include_deleted
        schema:
          description: Include servers pending deletion.
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerListResponse'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
